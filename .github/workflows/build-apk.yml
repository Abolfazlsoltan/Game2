name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # The image keeps its preinstalled editor settings and templates under /root.
      # GitHub Actions runs this container with HOME=/github/home, so move/copy them
      # into the active user's Godot directories before exporting.
      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -f /root/debug.keystore
          java -version
          godot --version
          sdkmanager --licenses </dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate and import project
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit

      - name: Export debug APK
        run: |
          godot --headless --verbose --path . --export-debug "Android" build/SmallWarriors.apk
          test -s build/SmallWarriors.apk
          file build/SmallWarriors.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallWarriors-Android-APK
          path: build/SmallWarriors.apk
          if-no-files-found: error
          retention-days: 30
