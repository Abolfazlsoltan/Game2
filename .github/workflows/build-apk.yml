name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.5"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/"
          cp -a /root/.config/godot/. "$HOME/.config/godot/"
          test -f /root/debug.keystore
          test -f "$HOME/.config/godot/editor_settings-4.5.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.5.stable/android_debug.apk"
          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/33.0.2"
          test -d "$ANDROID_HOME/ndk/25.2.9519653"
          test -d "$ANDROID_HOME/cmake/3.22.1"
          java -version
          godot --version
          # This CI image already contains the required SDK packages; accept licenses
          # without reinstalling packages into duplicate platform-tools directories.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail

      - name: Validate and import project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build
          godot --headless --path . --editor --quit

      - name: Export and verify debug APK
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --verbose --path . --export-debug "Android" build/SmallWarriors.apk 2>&1 | tee build/export.log
          test -s build/SmallWarriors.apk
          unzip -t build/SmallWarriors.apk
          unzip -l build/SmallWarriors.apk | grep -E 'lib/arm64-v8a/.*\.so|AndroidManifest.xml'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmallWarriors-Android-APK
          path: build/SmallWarriors.apk
          if-no-files-found: error
          retention-days: 30
